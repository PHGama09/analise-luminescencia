[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luminescencia"
version = "0.17.0"
description = "Análise de luminescência por vídeo"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "pandas",
    "tqdm",
    "pyyaml",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
luminescencia = "luminescencia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
