# Configuração compartilhada por todas as etapas do projeto.
# Valores "null" significam "não conferir".

protocolo:
  fps_esperado: 15            # padrão do protocolo (referência principal da auditoria)
  fps_tolerancia: 0.5         # diferença aceita, em fps
  modo_gravacao: experimento_completo   # o vídeo mostra os primeiros frames de excitação e o decaimento
  instante_queda_s: 0.5       # só o ajuste de modelos (modelos.py) usa isto: o decaimento é ajustado a partir daqui.
                              # A queda real fica em 0,20-0,40 s (mediana 0,33 s, 243 vídeos); 0,5 s deixa uma folga e
                              # é o MESMO corte para todos os vídeos (não alinhar vídeo a vídeo, para não criar diferenças entre grupos).
  duracao_esperada_s: 60      # vídeo mais curto ou mais longo que isso (± tolerância) vira problema
  duracao_tolerancia_s: 1.0
  amostras: [A, B, C]
  videos_por_amostra: 5
  resolucao_esperada: null    # ex.: [1920, 1080]; null = usa a mais comum do lote como alerta

pastas:
  videos: "G:/Meu Drive/Nova pasta"
  saida: output

nomes:
  # Formato: <CORES>_<qtd>[_<qtd>[_<qtd>]]_v<N><letra>  ex.: GB_1_05_v1a (veja nomes.py)
  controle: referencia        # palavra que identifica o vídeo de controle (sem luminescência)
  soma_esperada: 1.5          # soma das quantidades dos pós; null = não conferir
  soma_tolerancia: 0.01
  extensoes: [".mp4", ".mov", ".avi", ".mkv", ".m4v"]

auditoria:
  jitter_tolerancia: 0.5
  truncado_fracao: 0.98
  duplicados_tolerancia: 0.05 # modo completo: acima disso na MEDIANA do lote, vira alerta do lote
  duplicados_desvio: 0.03     # vídeo com % de frames idênticos diferente da mediana por mais que isso vira problema
  workers: 6                  # vídeos auditados ao mesmo tempo
  verificar_completude: false
  pastas_ignoradas: ["Proporcao de Branco 6000"]   # nome da pasta (em qualquer nível); não são lidas nem listadas

deteccao_queda:
  # Procura o instante em que a luz de excitação apaga, só nos primeiros segundos do vídeo.
  # Serve para VERIFICAR (não altera nada); quando falha, o vídeo vai para o bloco de revisão manual.
  janela_inicio_s: 0
  janela_fim_s: 1.0           # a queda deve estar entre 0 e 1 s
  contexto_s: 0.5             # lê um pouco além da janela para ver o que vem depois da queda
  fracao_brilho: 0.05         # o brilho de cada frame é a média dos 5% de pixels mais claros
  queda_minima: 0.50          # queda mínima de brilho (média de 3 frames antes contra 3 depois), em fração do anterior (medido: 0,86-0,997)
  desvio_lote_s: 0.15         # queda detectada a mais que isso da mediana dos vídeos vai para a revisão (medido: até 0,13 s)
divisao:
  # Só para conferência visual (coluna "grupo" do relatório). Derivada da letra da amostra.
  treino: [A, B]
  validacao: [C]

curadoria:
  arquivo: curadoria.csv      # suas decisões por vídeo; fica na raiz do projeto (não é apagado nem sobrescrito)
  motivos: [erro_de_gravacao, duracao_invalida, queda_nao_detectada, nome_errado, pasta_errada,
            video_duplicado, condicao_diferente, qualidade_ruim, outro]

ajuste:
  # Colunas do CSV da extração que serão ajustadas (nomes provisórios, a confirmar na etapa 3).
  canais: {R: media_R, G: media_G, B: media_B}
  # Ordem de preferência (orientação do professor): exponencial simples é o ideal;
  # se não servir, exponencial dupla.
  modelos: [exp_simples, exp_dupla]
  r2_minimo: 0.99             # R² mínimo para aceitar um modelo
  delta_bic: 10               # ganho de BIC exigido para trocar o modelo simples pelo mais complexo
  fracao_minima_componente: 0.05   # na dupla, cada componente deve ter pelo menos 5% da amplitude
  separacao_minima_tau: 1.5        # na dupla, tau lento / tau rápido deve ser pelo menos isso
  minimo_pontos: 8

roi:
  # Programa 2 (roi.py): a ROI é achada sozinha, depois que a luz de excitação apaga.
  janela_s: [0.6, 1.5]        # quadros usados para achar a amostra (a queda máxima medida é 0,40 s)
  margem_interna: 0.12        # a ROI usa 88% do raio detectado, para fugir da borda borrada
  circularidade_minima: 0.85  # abaixo disso o vídeo vira suspeito
  contraste_minimo: 3.0       # brilho dentro / fora do círculo
  desvio_raio_lote: 0.25      # raio diferente da mediana do lote por mais que isso = suspeito (o centro NÃO é critério)
  pico_minimo: 4.0            # abaixo disso a janela não tem brilho de amostra (controle)
  workers: 6
  mosaico: {colunas: 4, linhas: 6, largura_tile: 480}

extracao:
  # Programa 3 (extracao.py). O corte entre excitação e decaimento é protocolo.instante_queda_s (o mesmo para todos).
  saturacao_limiar: 250       # pixel com algum canal >= isto conta como saturado (o B passa perto do teto nos primeiros ~2 s)
  cantos_px: 80               # lado dos 4 quadrados de canto, longe da amostra, que medem o nível de preto da câmera
  piso_minimo: 1.0
  fator_ruido: 5.0            # canal perto do ruído: (amplitude inicial - piso do vídeo) < fator * piso (provisório)
  janela_fim_s: 10            # o "nível final" do resumo é a mediana dos últimos tantos segundos
  workers: 6

consolidacao:
  # Programa 4 (consolidacao.py).
  piso: video                 # video = preto corrigido por vídeo (cantos do vídeo - diferença canto/ROI do controle); referencia = piso fixo do controle
  incluir_pendentes_ok: true  # incluir = pendente com auditoria ok entra; pendente com alerta fica de fora até você decidir
  canto_sem_piso: true        # 04/11/2026: preto pelo canto REAL (relido dos CSVs por vídeo), sem o max com extracao.piso_minimo; false = como antes
  canto_min_quadros: 100      # trava 1: canto abaixo do piso só vale com pelo menos isto de quadros no decaimento
  canto_max_variacao: 0.3     # trava 2: |mediana 1ª metade - 2ª metade| do canto (nível); acima disto o canto é instável e volta ao piso
  canto_minimo_absoluto: 0.3  # trava 3: canto abaixo disto não é plausível e volta ao piso

posprocessamento:
  # Programa 5 (posprocessamento.py). Não altera valores; só recorta a janela e sinaliza.
  inicio_ajuste_s: 2.5        # o ajuste começa neste instante, IGUAL para todos os vídeos (cobre ~96% sem saturação)
  janelas_sensibilidade: [2.0, 2.5, 3.0]   # instantes para o teste de sensibilidade do tau
  saturacao_pct_max: 0.0      # quadro com saturados_pct acima disto conta como saturado
  frac_nao_positivo_max: 0.10 # canal com mais que isso dos pontos <= 0 (cauda no ruído) recebe aviso; não é excluído

modelagem:
  # Programa 6a (modelar.py): ajuste em lote. Sem isto usa os padrões abaixo.
  ruido_k: 3.0                # o ajuste termina onde a mediana móvel do sinal deixa de passar de k x ruído do canal
  janela_mediana_pontos: 31   # largura da mediana móvel (~4 s)
  duracao_minima_s: 5.0       # sinal que dura menos que isso depois do início não é ajustado
  c_livre_num_video: todos    # C livre em todos os vídeos; um número (1 a 5) limita a esse vídeo de cada grupo
  gama: 2.2                   # sensibilidade (D5): ajuste C = 0 sobre o sinal linearizado pela gama. null desliga. NÃO é o padrão
  c_livre_c_minimo: -1.35     # Q1 (03/11/2026): patamar C do ajuste C livre não pode ficar abaixo disto (níveis). null desliga (volta ao v0.9.0).
                              # -1,35 = 3 x 0,45, o erro do preto medido no R (desvio do nível final entre regravações, piso por vídeo). Só o R é afetado
                              # (6 de 227 colados; G e B têm C positivo). Com 0,0 viravam 106 (47%) e o R_cl copiava o R_c0. Se mudar a sessão, refazer o teste.
  workers: 4

graficos:
  # Programa 7 (graficos.py). Vídeo típico = o da proporção com o tau principal mais perto da mediana.
  proporcoes_tipicas: [B1.5, G1.5, R1.5, G1_B0.5, R1_B0.5, R0.5_G0.5_B0.5]
  dpi: 130
  bin_residuo_s: 2.0
  bin_normalizada_s: 1.0
  # P4 (v0.11.0), gráficos 5 a 7: janelas (s desde o início do ajuste) onde se mede a inclinação 'cedo' e 'tarde' de cada transformação
  janelas_inclinacao: {R: [[2, 6], [8, 14]], G: [[2, 7], [20, 30]], B: [[2, 7], [20, 30]]}   # o R chega ao ruído mais cedo
  k_ruido_inclinacao: 3.0     # só pontos com I > k x ruído do canal entram nas inclinações

entradas:
  # entradas.py (D1): quais colunas da tabela a IA pode usar. Nunca meta, alvo ou canal_ativo_*.
  caminhos: [cl, c0]          # cl, c0 ou os dois (treinar com só cl, só c0 e ambos)
  canais_sem_po: true         # true = todo canal com ajuste entra (treino "com"). false = só canal com sinal forte (treino "sem"; precisa do limiar)
  limiar_inicio_corr: null    # com canais_sem_po: false, ex.: {R: 40, G: 150, B: 150}. Regra MEDIDA no vídeo; os níveis se sobrepõem (ver entradas.py)
  descritores: false          # Q3 (03/11/2026): true = acrescenta os descritores sem modelo (descritores.csv) às entradas. Nunca meta, alvo ou canal_ativo_*
  descritores_sem_nao_confiaveis_R: false   # true = tira R_md_t10, R_md_r_20s, R_md_r_40s (lista em descritores.nao_confiaveis_R); false mantém todas (Q2)
  bloquear_diagnosticos: true # E1 (04/11/2026): diagnósticos <canal>_<cl|c0|md>_{ok,r2,rmse,inicio_s,fim_s,n_pontos} nunca entram

descritores:
  # Programa 6d (descritores.py, P3): descritores do decaimento que NÃO dependem de modelo; tabela paralela ao dataset.csv.
  niveis_queda: [0.5, 0.1]        # t50 e t10: tempo para I/I0 cair a 50% e a 10%
  tempos_fixos_s: [2, 5, 10, 20, 40]   # I(T)/I0 em T segundos depois do início da janela (vazio se o sinal já sumiu no ruído)
  horizontes_area_s: [10, 30]     # área sob I/I0 de 0 a H segundos
  suavizacao_pontos: 5            # mediana móvel só para achar cruzamentos e ler valores em tempos fixos
  k_ruido_nivel: 3.0              # nível-alvo precisa passar de k x ruído do canal para o cruzamento valer
  nao_confiaveis_R: [t10, r_20s, r_40s]   # Q2 (03/11/2026): só AVISO no dicionario_descritores.csv (no R o sinal chega ao ruído); a coluna continua na tabela

offset:
  # P5 (03/11/2026, offset.py): teste do offset cantos - ROI. Só análise.
  limiar_vazamento: 3.0       # canal 'sem sinal' = perto do ruído e nível inicial a menos disto acima do canto (níveis)
  tolerancia_offset: 1.0      # erro do offset (medido - controle) aceito no relatório (níveis)

# P6a (03/11/2026, tudo.py): comando `luminescencia tudo`. Relatório de cada etapa, relativo a pastas.saida (recebe o carimbo de versão).
tudo:
  rtol: 1.0e-3           # P6b: tolerância relativa da conferência de regressão (mediana/média; contagens são exatas)
  atol: 1.0e-9           # P6b: tolerância absoluta (valores perto de 0)
  etapas:
    consolidar: consolidacao/relatorio_consolidacao.txt
    pos: posprocessamento/relatorio_posprocessamento.txt
    modelar: modelagem/relatorio_modelagem.txt
    tabela: tabela/relatorio_tabela.txt
    comparar_modelos: modelagem/relatorio_comparacao_modelos.txt
    descritores: tabela/relatorio_descritores.txt
    offset: offset/relatorio_offset.txt
    graficos: graficos/graficos_resumo.txt

# Q4/B5 (v0.13.0, deriva.py): deriva de sessão A/B/C. Só análise; lê output/tabela/dataset.csv e descritores.csv.
deriva:
  grandezas: {I0: "{c}_md_I0", t50: "{c}_md_t50", r_5s: "{c}_md_r_5s", auc_10s: "{c}_md_auc_10s", tau_cl: "{c}_cl_tau_medio", tau_c0: "{c}_c0_tau_medio"}
  razoes: {razao_I0: "razao_I0_{par}", razao_t50: "razao_t50_{par}"}   # razões entre canais (colunas de descritores.csv)
  pares: [R_G, G_B, R_B]
  limiar_inicio_corr: {R: 20, G: 20, B: 20}   # regra MEDIDA de "canal com sinal" (mediana de inicio_corr da proporção, em níveis); nunca prop_*
  min_n_por_amostra: 3        # regravações válidas exigidas em cada amostra para a célula entrar
  alfa: 0.05                  # p de permutação (sobre eta² em log) para marcar a célula
  eta2_minimo: 0.30           # efeito mínimo (fração da variância entre amostras) para marcar a célula; n = 5 por grupo: p sozinho engana
  alfa_global: 0.01           # nível do teste binomial (fração de células marcadas contra alfa) e do teste da ordem monotônica
  n_permutacoes: 5000
  semente: 12345
  fator_acima_do_acaso: 1.5   # d observado / d esperado sem deriva a partir do qual a diferença entre amostras conta como maior que a das regravações
  fracao_offset_comum_minima: 0.5   # acima disto, normalizar por sessão (um fator por amostra) removeria a maior parte da deriva
  dpi: 120

# Q4/B13 (v0.13.0, colinearidade.py): colunas redundantes entre as que entradas.py permitiria. Só análise.
colinearidade:
  limite_r: 0.95              # par redundante: |r| (Spearman ou Pearson) acima disto
  vif_maximo: 10.0            # poda dos conjuntos mínimos
  vif_folgado: 30.0           # variante mais folgada dos mesmos conjuntos
  variancia_pca: 0.95         # dimensões efetivas = componentes para esta fração da variância
  corte_cluster: 0.05         # agrupamento hierárquico por 1-|r| (0,05 = |r| >= 0,95 no mesmo grupo)
  fracao_nan_maxima: 0.30     # coluna mais vazia que isto sai da análise
  min_linhas: 30
  amostras: null              # null = todas as linhas (original); [A, B] = só estas. A flag --so-treino usa divisao.treino e tira os saturados
  # colunas que descrevem o ajuste/janela (não o decaimento): entram na análise "completa", saem da "sem_diag" e dos conjuntos propostos
  excluir_dos_conjuntos: ['_modelo$', '_ok$', '^sinal_presente_', '_r2$', '_rmse$', '_n_pontos$', '_inicio_s$', '_fim_s$']
  preferencia: ['_tau_medio$', '_md_I0$', '_md_t50$', '_md_r_5s$', '_md_auc_10s$']   # representante preferido dentro de um grupo redundante
  conjuntos:                  # reservatórios (padrões de nome); a poda por VIF escolhe as colunas
    so_descritores: ['^[RGB]_md_', '^razao_']
    so_tau: ['^[RGB]_(cl|c0)_(tau1|tau2|tau_medio|fracao_rapida|A1|A2|C)$']
    misto: ['^[RGB]_(cl|c0)_(tau1|tau2|tau_medio|fracao_rapida|A1|A2|C)$', '^[RGB]_md_', '^razao_', '^(inicio|final)_corr_[RGB]$']
  dpi: 120

# Q4/B12 (v0.13.0, janela_r.py): fim de janela específico do R. Só sensibilidade; não muda o padrão (modelagem.ruido_k) nem o dataset.
janela_r:
  canal: R
  regras:                     # fim = onde a mediana móvel deixa de passar de k x ruído; duracao_max_s limita o fim a início + duração. A regra do pipeline (k = modelagem.ruido_k) entra sempre
    - {k: 4}
    - {k: 5}
    - {k: 6}
    - {k: 3, duracao_max_s: 20}
    - {k: 3, duracao_max_s: 30}
  min_n_por_grupo: 3          # regravações válidas exigidas por proporção x amostra para entrar no CV
  dt_fim_min_s: 0.05          # diferença de fim de janela que conta como "mudou" no relatório
  t50_pontos_i0: 5            # t50 sem modelo: I0 = mediana dos primeiros pontos
  t50_suavizacao_pontos: 5    # e mediana móvel desta largura
  workers: null               # null = modelagem.workers (limitado ao número de CPUs)
  criterios:                  # limiares de DECISÃO da recomendação (não são resultados): a regra tem de atender todos
    max_aumento_nao_ajustavel: 0.02   # fração de sinais que podem deixar de ser ajustáveis, a mais que a regra atual
    melhora_cv_minima: 0.10           # CV mediano do tau (cl e c0) precisa cair pelo menos esta fração
    max_piora_discrepancia: 0.0       # a diferença mediana cl x c0 não pode aumentar

# Q4/B11 (v0.13.0, saturados.py): vídeos saturados (a_parte) x irmãos reajustados na MESMA janela. Só análise; não muda o dataset.
saturados:
  min_irmaos: 3               # irmãos com ajuste válido exigidos para haver base de comparação
  z_comparavel: 2.0           # LIMIARES DE DECISÃO (não são resultados): z = (razão saturado/mediana dos irmãos - 1) / CV dos irmãos
  z_duvidoso: 3.0             # |z| <= z_comparavel: comparável; <= z_duvidoso: duvidoso; acima: não usar
  cv_piso: 0.02               # CV mínimo no z (3 a 5 regravações podem dar CV perto de zero por acaso)
  razao_maxima_comparavel: 0.20   # |razão - 1| acima disto nunca é "comparável" (protege contra irmãos muito dispersos, onde o z fica pequeno com razão enorme)
  calibrar_pelos_irmaos: true # os limites sobem até o maior |z| de um irmão contra os demais (quando há mais irmãos que min_irmaos)
  metricas_veredito: [tau_medio, t50]   # grandezas que decidem; I0 é só informativo (depende do instante da janela)
  fracao_canal_decisao: 0.5   # canal decide se esta fração dos vídeos da proporção (sem saturação) o usa no ajuste (videos_pos)
  outras_amostras_limita_a_duvidoso: true   # sem irmãos na mesma amostra, a comparação com outras amostras carrega a deriva de sessão
  min_n_por_amostra: 3        # grupo proporção x amostra com menos vídeos de treino que isto entra no efeito_grupo
  tolerancia_borda_quadros: 2 # o vídeo cobre a janela se seus quadros ficam a até este nº de passos das bordas (os vídeos têm fase de quadro diferente)
  t50_pontos_i0: 5            # t50 sem modelo: I0 = mediana dos primeiros pontos da janela
  t50_suavizacao_pontos: 5    # e mediana móvel desta largura
  workers: null               # null = modelagem.workers (limitado ao número de CPUs)

# BLOCO 2B (qualidade.py): qualidade e viés dos diagnósticos do ajuste (r2, rmse, n_pontos, fim_s, inicio_s, ok). Só análise; nenhum peso é aplicado.
qualidade:
  amostras: null              # null = divisao.treino (A+B). A amostra C nunca entra; os saturados também ficam fora
  n_permutacoes: 2000         # permutação no nível da PREPARAÇÃO (proporção x amostra), nunca do vídeo
  semente: 20261104
  # LIMIARES DE DECISÃO (não são resultados; provisórios, o orientador confirma):
  limite_eta2_prop: 0.10      # η² AJUSTADO (observado - média sob permutação) da proporção abaixo disto = "usável como peso"
  limite_eta2_amostra: 0.10   # variância adicional da amostra (depois da proporção) a partir da qual há aviso de deriva de sessão
  alfa: 0.05                  # "viés" exige η² ajustado >= limite E p < alfa; com p >= alfa o veredito é "inconclusivo"
  min_linhas: 30              # diagnóstico com menos linhas válidas: "dados insuficientes"
  min_proporcoes: 4           # ... ou com valores em menos proporções que isto
  quantil_baixo: 0.10         # candidato a baixo peso = estritamente pior que este quantil (diagnóstico binário: o valor pior, se minoritário)
  fracao_prep_maioria: 0.5    # preparação "com maioria candidata" = fração de vídeos candidatos >= isto
  direcao:                    # qual lado é o MELHOR de cada diagnóstico (inicio_s é suposição; confirme)
    r2: maior
    ok: maior
    n_pontos: maior
    fim_s: maior
    rmse: menor
    inicio_s: menor

# BLOCO 1 (avaliacao.py): dobras agrupadas por preparação, métricas e trava da amostra C. Só A+B; nada aqui abre C.
avaliacao:
  amostras_treino: [A, B]       # treino/validação interna (unidade = proporção x amostra)
  amostra_final: C              # só via avaliacao.abrir_c (precisa de docs/preregistro.json válido)
  soma_proporcoes: 1.5          # fração-alvo f = prop / 1,5 (soma 1)
  tolerancia_soma: 1.0e-6       # tolerância da conferência "frações somam 1"
  bootstrap_n: 5000             # reamostragens de preparações para os IC 95%
  semente: 20261104             # semente fixa do bootstrap (mesma saída em toda rodada)
  nivel_ic: 0.95
  pasta_tabela: null            # null = <pastas.saida>/tabela

# BLOCO 1 (linhas_base.py, comando avaliar_base): linhas de base SEM aprendizado, só A<->B e leave-one-proporção-out. Nunca C.
linhas_base:
  esquemas: [a_b, leave_one_proporcao_out]   # opcional também: por_preparacao
  regra_fixa:
    grandezas: [I0, auc_10s]    # fração do canal proporcional à grandeza, normalizada para somar 1; a PRIMEIRA é a primária (piso de D3(c))
  entradas:                     # sobrepõe [entradas] só em memória, só neste comando (o bloco entradas acima não muda)
    caminhos: [c0]
    descritores: true
    canais_sem_po: true
    bloquear_diagnosticos: true
    descritores_sem_nao_confiaveis_R: false
  proporcoes_sensibilidade: [G0.5_B1, R1.5]  # métricas repetidas SEM cada uma (G0.5_B1 nunca está em A; R1.5 não tem G/B)
  saida: avaliacao              # pasta dentro de pastas.saida

# BLOCO 1 (preregistro.py, comando preregistrar): o que fica congelado antes de abrir C. As declarações abaixo são copiadas para
# docs/preregistro.json; mudar qualquer item (ou o conteúdo das seções listadas) depois de preregistrar trava abrir_c.
preregistro:
  arquivo_json: docs/preregistro.json
  arquivo_md: docs/preregistro.md
  aval_orientador: null        # v0.16.5: data do aval do orientador (AAAA-MM-DD). null = preregistrar recusa (até com --forcar) e C fica travada
  arquivos_tabela: [dataset.csv, descritores.csv, dicionario.csv, dicionario_descritores.csv]   # em <pastas.saida>/tabela
  secoes_config: [protocolo, ajuste, posprocessamento, modelagem, entradas, descritores, avaliacao, linhas_base, preregistro]
  declaracoes:
    variante_primaria:
      id: c0_descritores
      decisao: D4
      caminhos: [c0]
      descritores: true
      descritores_prioritarios: [razoes entre canais, t50, r_5s, auc_10s]
      conjuntos_de_colunas: [so_descritores, so_tau, misto]
      canais_sem_po: true
      bloquear_diagnosticos: true
      dependencia_declarada: o resultado depende do início da janela de ajuste (2,5 s no protocolo atual)
    sensibilidades:
      - caminho cl e caminhos cl+c0
      - sem descritores
      - canais_sem_po false (sinal forte medido; não equivale a "sem vazamento")
      - métricas com e sem a proporção G0.5_B1
    criterio_d3:
      decisao: D3
      nivel_minimo_razao_max: 0.70     # MAE médio em C <= 70% do MAE da média
      nivel_forte_razao_max: 0.50      # MAE médio em C <= 50% do MAE da média
      condicao_b: nenhuma proporção com MAE pior que o da média
      condicao_c: ganho pareado por proporção (16 pares) sobre a regra fixa física (fração do canal proporcional ao seu I0, normalizada para somar 1; sem parâmetros ajustados), IC 95% por reamostragem que não inclui 0; k-vizinhos adiado, nenhum modelo por enquanto
      falha: falhou em (b) ou (c), ou ficou acima de 70% = não demonstrado
    validacao_d2:
      estado: provisória (levar ao orientador)
      interna: A<->B para escolher entradas e hiperparâmetros; leave-one-proporção-out só como estresse; leave-one-preparação-out como apoio
      unidade: preparação (proporção x amostra); regravações sempre do mesmo lado
      final: C aberta uma vez, no fim, via abrir_c
      limite_d6: uma preparação de validação por composição (D6, provisória)

ic_simulacao:                  # Bloco 2C / D6 (provisória): IC do erro em C por simulação; só análise
  pasta_deriva: deriva         # dentro de pastas.saida; lê deriva_variancia.csv, deriva_por_grandeza.csv, deriva_celulas.csv
  grandezas: [razao_I0, razao_t50, t50, r_5s, auc_10s]   # descritores da D4 (linhas de deriva_variancia.csv usadas nas frações)
  cenarios_quantil: {mediana: 0.5, p75: 0.75}            # quantil das frações medidas entre as linhas; p75 = deriva maior
  n_preparacoes: [1, 2, 3]
  n_regravacoes: 5             # regravações por preparação (média por preparação)
  mae_verdadeiro: [0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20]   # grade hipotética do MAE verdadeiro
  replicas: 20000
  semente: 12345
  nivel_ic: 0.95
  nivel_minimo_razao_max: 0.70   # iguais a preregistro.criterio_d3 (D3)
  nivel_forte_razao_max: 0.50
  proporcoes: null             # null = união de deriva_celulas.csv e deriva_descartadas.csv
